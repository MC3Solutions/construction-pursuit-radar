name: Daily procurement source scrape

on:
  workflow_dispatch:
  schedule:
    # 5:10 AM EDT (09:10 UTC)
    - cron: '10 9 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/scrape-priority-fast.mjs'
      - 'scripts/repair-priority-sources.mjs'
      - 'scripts/fix-stream.mjs'
      - 'scripts/scrape-dot-sources.mjs'
      - 'scripts/fix-ncdot-sources.mjs'
      - 'scripts/fetch-federal-sam.mjs'
      - 'scripts/geocode-current.mjs'
      - 'scripts/finalize-source-health.mjs'
      - 'scripts/update-index-current-sources.mjs'
      - 'package.json'
      - 'source-health-ui.js'
      - 'index.html'
      - '.github/workflows/daily-source-scrape.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: procurement-source-refresh-v2
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out radar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh federal opportunities from SAM.gov API
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: node scripts/fetch-federal-sam.mjs

      - name: Install scraper dependencies
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Geocode federal pins from place of performance
        continue-on-error: true
        run: node scripts/geocode-current.mjs

      - name: Install Chromium
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Scrape priority procurement sites
        continue-on-error: true
        run: node scripts/scrape-priority-fast.mjs

      - name: Repair eVA, STREAM, and TDOT source adapters
        continue-on-error: true
        run: node scripts/repair-priority-sources.mjs

      - name: Parse live STREAM bid opening dates
        continue-on-error: true
        run: node scripts/fix-stream.mjs

      - name: Scrape VDOT CABB and NCDOT lettings
        continue-on-error: true
        run: node scripts/scrape-dot-sources.mjs

      - name: Repair NCDOT from direct letting pages
        continue-on-error: true
        run: node scripts/fix-ncdot-sources.mjs

      - name: Restore federal source health after state refreshes
        run: node scripts/finalize-source-health.mjs

      - name: Keep dashboard on current data files
        run: node scripts/update-index-current-sources.mjs

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-scraper-diagnostics-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit refreshed data
        run: |
          git config user.name "MC3 Pursuit Radar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh procurement sources $(date -u +%F)"
            git push
          fi

      - name: Build static Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll source-health-ui.js _site/
          cp -r data _site/data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy refreshed radar
        id: deployment
        uses: actions/deploy-pages@v4
